name: Reconcile GitHub project content

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-github-projects
  cancel-in-progress: true

jobs:
  reconcile:
    name: Migrate database and trigger production reconciliation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-delivery
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply and verify production database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing the DATABASE_URL_UNPOOLED GitHub Actions secret."
            exit 1
          fi
          npm run db:migrate
          npm run db:verify
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing the VERCEL_DEPLOY_HOOK_URL GitHub Actions secret."
            exit 1
          fi
          curl --fail --show-error --silent --max-time 30 --request POST "$VERCEL_DEPLOY_HOOK_URL"
