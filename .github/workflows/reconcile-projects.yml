name: Reconcile GitHub project content

on:
  repository_dispatch:
    types:
      - notes-published
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-github-projects
  cancel-in-progress: true

jobs:
  reconcile:
    name: Trigger production reconciliation
    if: github.ref == 'refs/heads/main' && (github.event_name != 'repository_dispatch' || github.event.action == 'notes-published')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-delivery
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate notes publication payload
        if: github.event_name == 'repository_dispatch'
        env:
          NOTES_COMMIT: ${{ github.event.client_payload.notes_commit }}
        run: |
          node -e "const value = process.env.NOTES_COMMIT || ''; if (!/^[0-9a-f]{40}$/.test(value)) { console.error('::error::notes-published requires a 40-character lowercase notes_commit SHA.'); process.exit(1); }"
      - name: Migrate and verify production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing the DATABASE_URL_UNPOOLED GitHub Actions secret."
            exit 1
          fi
          npm run db:check
          npm run db:migrate
          npm run db:verify
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing the VERCEL_DEPLOY_HOOK_URL GitHub Actions secret."
            exit 1
          fi
          curl --fail --show-error --silent --max-time 30 --request POST "$VERCEL_DEPLOY_HOOK_URL"
