name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      GITHUB_OWNER: fixture-owner
      KV_REST_API_URL: https://redis.example.test
      KV_REST_API_TOKEN: ci-redis-token
      ANON_SESSION_SECRET: ci-anonymous-session-secret-with-more-than-32-characters
      OPENAI_API_KEY: ci-openai-key
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_REFRESH_TOKEN: ci-google-refresh-token
    services:
      redis:
        image: redis:8.10.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare GitHub project fixture
        run: |
          mkdir -p .cache
          cp fixtures/github-projects.json .cache/github-projects.json
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test local Redis adapter
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis
      - name: Validate production environment
        run: npm run env:validate
      - name: Prepare and seed Postgres
        env:
          DATABASE_URL: postgres://portfolio:portfolio@127.0.0.1:5433/portfolio
        run: |
          npm run db:push
          npm run db:seed
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Type-check
        run: npm run typecheck
      - name: Build fixture-backed production application
        env:
          PROJECTS_SYNC_SKIP: "1"
        run: npm run build

  deploy:
    name: Trigger Vercel production deployment
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing the VERCEL_DEPLOY_HOOK_URL GitHub Actions secret."
            exit 1
          fi
          curl --fail --show-error --silent --max-time 30 --request POST "$VERCEL_DEPLOY_HOOK_URL"
