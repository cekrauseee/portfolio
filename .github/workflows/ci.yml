name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build production application
        run: npm run build
      - name: Build GitHub-mode fixture application
        env:
          PROJECTS_SOURCE: github
          PROJECTS_SYNC_SKIP: "1"
        run: |
          mkdir -p .cache
          cp fixtures/github-projects.json .cache/github-projects.json
          npm run build

  deploy:
    name: Trigger Vercel production deployment
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing the VERCEL_DEPLOY_HOOK_URL GitHub Actions secret."
            exit 1
          fi
          curl --fail --show-error --silent --max-time 30 --request POST "$VERCEL_DEPLOY_HOOK_URL"
